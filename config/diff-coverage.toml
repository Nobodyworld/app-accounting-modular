# Repository-owned changed-production-line coverage policy.
#
# Coverage.py currently records the validated runtime under src/apps, src/plugins,
# and src/cli. Development tooling under src/tools is validated by focused tests
# but is not part of the release-authoritative runtime coverage denominator.
# Documentation colocated with runtime modules is not executable coverage input.

[diff_coverage]
include_roots = ["src/apps", "src/plugins", "src/cli", "packages/provider-sdk/src"]
# PEP 561 markers are package data and contain no executable Python lines.
exclude = ["**/*.md", "**/py.typed"]
minimum_changed_line_percent = 85.0
allow_no_changed_executable_lines = true

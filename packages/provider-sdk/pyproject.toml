[build-system]
requires = ["setuptools>=77,<84", "wheel>=0.45,<0.47"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-accounting-provider-sdk"
version = "0.5.0"
description = "Standalone structural contracts and author tooling for Modular Accounting providers"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "Modular Accounting contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.scripts]
modular-accounting-provider-sdk = "modular_accounting_provider_sdk.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modular_accounting_provider_sdk = ["py.typed"]

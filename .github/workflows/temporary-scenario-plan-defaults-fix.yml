name: Temporary scenario plan defaults fix

on:
  push:
    branches:
      - bug/scenario-plan-api-defaults

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout issue branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: bug/scenario-plan-api-defaults
          persist-credentials: true

      - name: Add plan-specific API schema and regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: Path, old: str, new: str) -> None:
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:120]!r}")
              path.write_text(source.replace(old, new), encoding="utf-8")

          schemas = Path("src/apps/api/schemas.py")
          replace_once(
              schemas,
              '    "ScenarioDefinition",\n    "ScenarioBatchRequest",',
              '    "ScenarioDefinition",\n    "ScenarioPlanDefinition",\n    "ScenarioBatchRequest",',
          )
          replace_once(
              schemas,
              dedent(
                  '''
                  class ScenarioBatchRequest(BaseModel):
                      """Request payload for executing snapshot scenarios in bulk."""
                  '''
              ).lstrip(),
              dedent(
                  '''
                  class ScenarioPlanDefinition(BaseModel):
                      """Scenario input whose defaultable fields may be supplied by a plan."""

                      name: str = Field(min_length=1)
                      base_currency: str | None = None
                      commodity_symbols: list[str] | None = None
                      jurisdictions: list[str] | None = None
                      tags: list[str] | None = None

                      def to_mapping(self) -> dict[str, object]:
                          payload: dict[str, object] = {"name": self.name}
                          for field_name in ("base_currency", "commodity_symbols", "jurisdictions", "tags"):
                              if field_name in self.model_fields_set:
                                  payload[field_name] = getattr(self, field_name)
                          return payload


                  class ScenarioBatchRequest(BaseModel):
                      """Request payload for executing snapshot scenarios in bulk."""
                  '''
              ).lstrip(),
          )
          replace_once(
              schemas,
              '    scenarios: list[ScenarioDefinition] = Field(min_length=1)\n    defaults: dict[str, object] = Field(default_factory=dict)',
              '    scenarios: list[ScenarioPlanDefinition] = Field(min_length=1)\n    defaults: dict[str, object] = Field(default_factory=dict)',
          )

          tests = Path("tests/test_snapshot_api.py")
          replace_once(
              tests,
              'from datetime import UTC, datetime\nfrom decimal import Decimal',
              'import json\nfrom datetime import UTC, datetime\nfrom decimal import Decimal\nfrom pathlib import Path',
          )
          test_source = tests.read_text(encoding="utf-8")
          marker = "def test_snapshot_plan_preview_accepts_checked_in_defaults_example"
          if marker in test_source:
              raise SystemExit("scenario plan defaults tests already exist")
          test_source += dedent(
              '''


              def _stub_plan_user() -> User:
                  return User(
                      id=2,
                      email="plan-defaults@example.com",
                      password_hash="stub",
                      is_active=True,
                  )


              def test_snapshot_plan_preview_accepts_checked_in_defaults_example(monkeypatch) -> None:
                  app = _create_app_without_db(monkeypatch)
                  app.dependency_overrides[get_current_user] = _stub_plan_user
                  example_path = (
                      Path(__file__).resolve().parents[1]
                      / "docs"
                      / "examples"
                      / "scenario-plan.json"
                  )
                  request_payload = json.loads(example_path.read_text(encoding="utf-8"))

                  with TestClient(app) as client:
                      response = client.post("/snapshot/plans/preview", json=request_payload)

                  assert response.status_code == 200
                  payload = response.json()
                  assert payload["plan"]["metadata"]["name"] == "demo_portfolio"
                  assert payload["summary"]["scenario_count"] == 2
                  assert sorted(payload["summary"]["base_currencies"]) == ["EUR", "USD"]
                  assert payload["plan"]["scenarios"][0]["base_currency"] == "USD"
                  assert payload["plan"]["scenarios"][1]["base_currency"] == "EUR"
                  assert payload["plan"]["scenarios"][1]["jurisdictions"] is None


              def test_snapshot_plan_preview_rejects_missing_base_without_default(monkeypatch) -> None:
                  app = _create_app_without_db(monkeypatch)
                  app.dependency_overrides[get_current_user] = _stub_plan_user

                  with TestClient(app) as client:
                      response = client.post(
                          "/snapshot/plans/preview",
                          json={
                              "metadata": {"name": "Missing Base"},
                              "scenarios": [{"name": "baseline"}],
                          },
                      )

                  assert response.status_code == 422
                  assert response.json()["detail"] == "base_currency must be a non-empty string"


              def test_snapshot_plan_preview_rejects_unsupported_default_keys(monkeypatch) -> None:
                  app = _create_app_without_db(monkeypatch)
                  app.dependency_overrides[get_current_user] = _stub_plan_user

                  with TestClient(app) as client:
                      response = client.post(
                          "/snapshot/plans/preview",
                          json={
                              "metadata": {"name": "Unsupported Defaults"},
                              "defaults": {
                                  "base_currency": "USD",
                                  "provider_key": "fx:stub",
                              },
                              "scenarios": [{"name": "baseline"}],
                          },
                      )

                  assert response.status_code == 422
                  assert response.json()["detail"] == "Unsupported default field 'provider_key'"
              '''
          )
          tests.write_text(test_source, encoding="utf-8")
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-scenario-plan-defaults-fix.yml
          git add src/apps/api/schemas.py tests/test_snapshot_api.py
          git diff --cached --check
          git commit -m "fix: apply scenario plan defaults before API validation"
          git push origin HEAD:bug/scenario-plan-api-defaults

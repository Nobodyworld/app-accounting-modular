name: Changed Production Coverage

on:
  pull_request:

permissions:
  contents: read

jobs:
  diff-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull-request head
        # actions/checkout v7.0.1 (released 2026-07-20; resolved 2026-07-31)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact pull-request base is available
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --no-recurse-submodules origin \
            "${{ github.event.pull_request.base.sha }}"
          git rev-parse --verify "${{ github.event.pull_request.base.sha }}^{commit}"
          git rev-parse --verify "${{ github.event.pull_request.head.sha }}^{commit}"

      - name: Set up Python
        # actions/setup-python v7.0.0 (released 2026-07-20; resolved 2026-07-31)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip

      - name: Install validated development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Generate release-authoritative coverage evidence
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/packages/provider-sdk/src
        run: |
          python -m pytest \
            -o cache_dir=.pytest_cache_runtime \
            --cov=src/apps \
            --cov=src/plugins \
            --cov=src/cli \
            --cov=packages/provider-sdk/src/modular_accounting_provider_sdk \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:coverage.json

      - name: Enforce changed-production-line coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/packages/provider-sdk/src
        run: |
          python -m src.tools.diff_coverage \
            coverage.json \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --config config/diff-coverage.toml \
            --json-output diff-coverage.json \
            --markdown-output diff-coverage.md

      - name: Show changed-line evidence
        if: always()
        run: cat diff-coverage.md || true

      - name: Upload changed-line evidence
        if: always()
        # actions/upload-artifact v7.0.1 (released 2026-04-10; resolved 2026-07-31)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: changed-production-coverage
          path: |
            coverage.json
            diff-coverage.json
            diff-coverage.md
          if-no-files-found: error
          retention-days: 14

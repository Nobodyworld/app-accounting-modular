name: Changed Production Coverage

on:
  pull_request:

permissions:
  contents: read

jobs:
  diff-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull-request head
        # actions/checkout v7.0.1 (released 2026-07-20; resolved 2026-07-31)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact pull-request base is available
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --no-recurse-submodules origin \
            "${{ github.event.pull_request.base.sha }}"
          git rev-parse --verify "${{ github.event.pull_request.base.sha }}^{commit}"
          git rev-parse --verify "${{ github.event.pull_request.head.sha }}^{commit}"

      - name: Set up Python
        # actions/setup-python v7.0.0 (released 2026-07-20; resolved 2026-07-31)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip

      - name: Install validated development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Capture forecast quality diagnostics
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_dir="${RUNNER_TEMP}/forecast-quality-diagnostic"
          mkdir -p "$diagnostic_dir/src/apps/api/services" \
            "$diagnostic_dir/src/apps/api/routers" \
            "$diagnostic_dir/tests"

          set +e
          python -m ruff check \
            src/apps/api/services/forecast_service.py \
            src/apps/api/services/forecast_legacy.py \
            src/apps/api/routers/forecast.py \
            tests/test_forecast_robustness.py \
            tests/test_forecast_api.py \
            > "$diagnostic_dir/ruff-check.log" 2>&1
          printf '%s\n' "$?" > "$diagnostic_dir/ruff-check-exit.txt"

          python -m mypy src/apps/api \
            > "$diagnostic_dir/mypy.log" 2>&1
          printf '%s\n' "$?" > "$diagnostic_dir/mypy-exit.txt"
          set -e

          python -m ruff format \
            src/apps/api/services/forecast_service.py \
            src/apps/api/services/forecast_legacy.py \
            src/apps/api/routers/forecast.py \
            tests/test_forecast_robustness.py \
            tests/test_forecast_api.py

          cp src/apps/api/services/forecast_service.py \
            "$diagnostic_dir/src/apps/api/services/forecast_service.py"
          cp src/apps/api/services/forecast_legacy.py \
            "$diagnostic_dir/src/apps/api/services/forecast_legacy.py"
          cp src/apps/api/routers/forecast.py \
            "$diagnostic_dir/src/apps/api/routers/forecast.py"
          cp tests/test_forecast_robustness.py \
            "$diagnostic_dir/tests/test_forecast_robustness.py"
          cp tests/test_forecast_api.py \
            "$diagnostic_dir/tests/test_forecast_api.py"

      - name: Generate release-authoritative coverage evidence
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m pytest \
            -o cache_dir=.pytest_cache_runtime \
            --cov=src/apps \
            --cov=src/plugins \
            --cov=src/cli \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:coverage.json

      - name: Enforce changed-production-line coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m src.tools.diff_coverage \
            coverage.json \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --config config/diff-coverage.toml \
            --json-output diff-coverage.json \
            --markdown-output diff-coverage.md

      - name: Show changed-line evidence
        if: always()
        run: cat diff-coverage.md || true

      - name: Upload changed-line evidence
        if: always()
        # actions/upload-artifact v7.0.1 (released 2026-04-10; resolved 2026-07-31)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: changed-production-coverage
          path: |
            coverage.json
            diff-coverage.json
            diff-coverage.md
            ${{ runner.temp }}/forecast-quality-diagnostic
          if-no-files-found: error
          retention-days: 14

name: Finalize Dependency Refresh

on:
  pull_request:
    paths:
      - .github/workflows/dependency-lock-refresh.yml

permissions:
  contents: read

jobs:
  finalize:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'deps/consolidated-runtime-and-attestation-refresh'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact pull-request head
        # actions/checkout v7.0.1 (released 2026-07-20; resolved 2026-07-31)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Correct attestation metadata and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/ci.yml')
          text = workflow.read_text(encoding='utf-8')
          old = '# actions/attest v4.2.1 (released 2026-07-29; resolved 2026-07-31)'
          new = '# actions/attest v4.2.2 (released 2026-08-04; resolved 2026-08-12)'
          if text.count(old) != 4:
              raise SystemExit(f'expected four stale attestation comments; found {text.count(old)}')
          workflow.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/dependency-lock-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "ci: finalize attestation refresh metadata"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

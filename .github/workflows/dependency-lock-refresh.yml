name: Dependency Lock Refresh Evidence

on:
  pull_request:
    paths:
      - requirements.txt
      - requirements-container.lock
      - requirements-lock-tools.lock
      - scripts/dependencies/**
      - .github/workflows/dependency-lock-refresh.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-container-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1 (released 2026-07-20; resolved 2026-07-31)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        # actions/setup-python v7.0.0 (released 2026-07-20; resolved 2026-07-31)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip

      - name: Install hashed lock-generation toolchain
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            -r requirements-lock-tools.lock

      - name: Generate and verify container runtime lock
        run: |
          python scripts/dependencies/generate_container_lock.py
          python scripts/dependencies/verify_container_lock.py
          sha256sum requirements.txt requirements-container.lock

      - name: Upload generated lock evidence
        # actions/upload-artifact v7.0.1 (released 2026-04-10; resolved 2026-07-31)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: generated-container-lock-${{ github.sha }}
          path: |
            requirements.txt
            requirements-container.lock
          if-no-files-found: error
          retention-days: 3

name: Container Smoke Compatibility

on:
  pull_request:

permissions:
  contents: read

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1 (released 2026-07-20; resolved 2026-07-31)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify container dependency lock
        run: python3 scripts/dependencies/verify_container_lock.py

      - name: Generate ephemeral Compose JWT secret
        shell: bash
        run: echo "MODACCT_JWT_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"

      - name: Build and start containers
        run: docker compose -p modacct-legacy-smoke -f config/docker-compose.yml up -d --build

      - name: Wait for API health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -p modacct-legacy-smoke -f config/docker-compose.yml ps
          docker compose -p modacct-legacy-smoke -f config/docker-compose.yml logs api
          exit 1

      - name: Wait for Streamlit health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -p modacct-legacy-smoke -f config/docker-compose.yml ps
          docker compose -p modacct-legacy-smoke -f config/docker-compose.yml logs web
          exit 1

      - name: Verify least-privilege runtime
        shell: bash
        run: |
          set -euo pipefail
          for service in api web; do
            container_id="$(docker compose -p modacct-legacy-smoke -f config/docker-compose.yml ps -q "$service")"
            test -n "$container_id"
            image_id="$(docker inspect "$container_id" --format '{{.Image}}')"
            image_user="$(docker image inspect "$image_id" --format '{{.Config.User}}')"
            case "$image_user" in
              10001|10001:10001) ;;
              *) echo "$service image does not declare the expected non-root user" >&2; exit 1 ;;
            esac
            test "$(docker compose -p modacct-legacy-smoke -f config/docker-compose.yml exec -T "$service" id -u)" = "10001"
            test "$(docker compose -p modacct-legacy-smoke -f config/docker-compose.yml exec -T "$service" id -g)" = "10001"
            test "$(docker inspect "$container_id" --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"
            docker inspect "$container_id" --format '{{json .HostConfig.CapDrop}}' | grep -q '"ALL"'
            docker inspect "$container_id" --format '{{json .HostConfig.SecurityOpt}}' | grep -q 'no-new-privileges:true'
          done

      - name: Tear down containers
        if: always()
        run: docker compose -p modacct-legacy-smoke -f config/docker-compose.yml down -v --remove-orphans

name: Container Smoke Compatibility

on:
  pull_request:

permissions:
  contents: read
  checks: read

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Require expanded container supply-chain check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 120); do
            response="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/commits/${COMMIT_SHA}/check-runs?per_page=100")"

            status="$(jq -r '[.check_runs[] | select(.name == "container-supply-chain")] | sort_by(.started_at) | last | .status // empty' <<<"$response")"
            conclusion="$(jq -r '[.check_runs[] | select(.name == "container-supply-chain")] | sort_by(.started_at) | last | .conclusion // empty' <<<"$response")"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "Expanded container-supply-chain check completed successfully."
                exit 0
              fi

              echo "Expanded container-supply-chain check concluded: ${conclusion:-unknown}" >&2
              exit 1
            fi

            echo "Waiting for container-supply-chain check (${attempt}/120)..."
            sleep 5
          done

          echo "Timed out waiting for container-supply-chain check." >&2
          exit 1

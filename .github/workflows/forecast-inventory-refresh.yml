name: Temporary Forecast Inventory Refresh

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  refresh-inventory:
    if: >-
      github.repository == 'Nobodyworld/app-accounting-modular' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'quality/critical-coverage-and-forecast-robustness'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact feature branch
        # actions/checkout v7.0.1 (released 2026-07-20; resolved 2026-07-31)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: quality/critical-coverage-and-forecast-robustness
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        # actions/setup-python v7.0.0 (released 2026-07-20; resolved 2026-07-31)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip

      - name: Install validated development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Apply fail-closed forecast policy update
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python scripts/quality/apply_forecast_inventory_update.py
          python -m ruff format scripts/security/inventory_routes.py
          python -m ruff check scripts/security/inventory_routes.py
          python -m ruff format --check scripts/security/inventory_routes.py
          git diff --check

      - name: Commit policy map before generating evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed="$(git diff --name-only)"
          test "$changed" = "scripts/security/inventory_routes.py"
          git add scripts/security/inventory_routes.py
          git commit -m "docs(security): map forecast authorization evidence"

      - name: Regenerate deterministic route inventory
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        shell: bash
        run: |
          set -euo pipefail
          python scripts/security/inventory_routes.py \
            --output docs/security/evidence/route-inventory.md
          cp docs/security/evidence/route-inventory.md "${RUNNER_TEMP}/route-inventory-first.md"
          python scripts/security/inventory_routes.py \
            --output docs/security/evidence/route-inventory.md
          cmp "${RUNNER_TEMP}/route-inventory-first.md" \
            docs/security/evidence/route-inventory.md
          grep -F "tests/test_forecast_api.py::test_tenant_authorization_runs_before_forecast_work" \
            docs/security/evidence/route-inventory.md
          if grep -F "route-level no-membership" docs/security/evidence/route-inventory.md; then
            echo "Stale forecast route gap remains" >&2
            exit 1
          fi
          git diff --check

      - name: Commit and push validated inventory
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "docs/security/evidence/route-inventory.md"
          git add docs/security/evidence/route-inventory.md
          git commit -m "docs(security): regenerate forecast route inventory"
          git push origin HEAD:quality/critical-coverage-and-forecast-robustness

name: Temporary repository Ruff cleanup

on:
  push:
    branches:
      - bug/scenario-plan-api-defaults

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout issue branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: bug/scenario-plan-api-defaults
          persist-credentials: true

      - name: Install repository formatter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Format the exact repository tree
        run: |
          python -m ruff format .
          python -m ruff format --check .

      - name: Commit formatting and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-repository-ruff-cleanup.yml
          if test -f .github/workflows/temporary-ruff-format-diagnostic.yml; then
            git rm .github/workflows/temporary-ruff-format-diagnostic.yml
          fi
          git add -A
          git diff --cached --check
          git commit -m "style: apply repository Ruff formatting"
          git push origin HEAD:bug/scenario-plan-api-defaults

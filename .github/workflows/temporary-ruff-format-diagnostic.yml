name: Temporary Ruff format diagnostic

on:
  push:
    branches:
      - bug/scenario-plan-api-defaults

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout issue branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: bug/scenario-plan-api-defaults
          persist-credentials: false

      - name: Install repository formatter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Capture exact Ruff format diff
        run: |
          python -m ruff format --diff . > ruff-format.diff || true
          test -s ruff-format.diff
          cat ruff-format.diff

      - name: Upload formatter evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ruff-format-diagnostic
          path: ruff-format.diff
          if-no-files-found: error
          retention-days: 2

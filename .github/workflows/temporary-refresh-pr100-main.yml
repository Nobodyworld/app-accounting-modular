name: Temporary refresh PR 100 against current main

on:
  push:
    branches:
      - bug/scenario-plan-api-defaults

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout issue branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: bug/scenario-plan-api-defaults
          persist-credentials: true
          fetch-depth: 0

      - name: Merge exact current main
        env:
          EXPECTED_MAIN_SHA: 25c2822fe9cf0712b7e0092f211eea3ccb093a91
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          git merge --no-edit origin/main

      - name: Remove temporary workflow and publish
        run: |
          git rm .github/workflows/temporary-refresh-pr100-main.yml
          git commit -m "chore: remove temporary PR refresh workflow"
          git push origin HEAD:bug/scenario-plan-api-defaults

name: Temporary Ruff Migration Full-History Gitleaks

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  full-history-gitleaks:
    if: >-
      github.repository == 'Nobodyworld/app-accounting-modular' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'tooling/ruff-0.16-migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete repository history
        # actions/checkout v7.0.1 (released 2026-07-20; resolved 2026-07-31)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install verified Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks_8.30.1_linux_x64.tar.gz"
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$install_dir" gitleaks
          chmod 0755 "$install_dir/gitleaks"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Scan every reachable repository ref
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/ruff-migration-gitleaks"
          mkdir -p "$evidence_dir"

          gitleaks version | tee "$evidence_dir/gitleaks-version.txt"
          git rev-list --all --count | tee "$evidence_dir/reachable-commit-count.txt"
          git rev-list --all --max-parents=0 | LC_ALL=C sort > "$evidence_dir/root-commits.txt"
          git rev-parse HEAD > "$evidence_dir/scanned-head.txt"

          gitleaks git . \
            --log-opts="--all" \
            --redact \
            --report-format json \
            --report-path "$evidence_dir/gitleaks-full-history.json" \
            --exit-code 1

          python - "$evidence_dir/gitleaks-full-history.json" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          payload = json.loads(path.read_text(encoding="utf-8") or "[]")
          if not isinstance(payload, list):
              raise SystemExit("Gitleaks report is not a JSON array")
          if payload:
              raise SystemExit(f"Gitleaks report contains {len(payload)} findings")
          print("full-history findings: 0")
          PY

          (
            cd "$evidence_dir"
            sha256sum \
              gitleaks-full-history.json \
              gitleaks-version.txt \
              reachable-commit-count.txt \
              root-commits.txt \
              scanned-head.txt \
              > evidence.sha256
          )

      - name: Upload redacted history-scan evidence
        # actions/upload-artifact v7.0.1 (released 2026-04-10; resolved 2026-07-31)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ruff-migration-full-history-gitleaks
          path: ${{ runner.temp }}/ruff-migration-gitleaks
          if-no-files-found: error
          retention-days: 14
